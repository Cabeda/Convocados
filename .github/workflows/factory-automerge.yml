# Auto-merge for machine-authored dependency bumps.
#
# INERT BY DEFAULT. It does nothing until `FACTORY_AUTOMERGE` is set to
# 'true'. Setting it is the activation, and unsetting it disarms everything
# already queued.
#
# Why a script and not an agent: a merge decision must be reproducible and
# auditable. `scripts/factory/automerge-eligibility.ts` is a list of named
# predicates with tests; an LLM asked "should this merge?" gives the same answer
# twice about half the time. Keep the judgement out of the model.
#
# Why auto-merge and not merge permission: the App is granted no `contents` and no
# merge scope here. `pull-requests: write` is enough to *arm* auto-merge, and
# GitHub fires the merge itself once the required checks settle. Branch
# protection is what actually prevents a forced merge, and it is untouched.
# Note honestly: `pull-requests: write` *can* call the merge endpoint, so the
# real constraint is `decideAutomerge()` plus branch protection — not the token.
#
# Reversal is two steps. Unsetting `FACTORY_AUTOMERGE` stops future runs but does
# NOT cancel auto-merge already armed on a PR; GitHub fires that independently
# of any repository variable. Every arm comment says so, and names the second
# step.
#
# Scope is deliberately narrow: dependabot bumps only. A human-authored Change
# gets a human, however green it is.
name: "factory: auto-merge"

on:
  schedule:
    - cron: "23,53 * * * *" # off the hour: :00/:30 are janitor and sweep
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report eligibility without arming auto-merge"
        required: false
        type: boolean
        default: true

# Reads the PR list and comments. No `contents`, so it cannot push to any branch.
permissions:
  pull-requests: write
  issues: read

concurrency:
  group: factory-automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Both switches, in the same order every other factory workflow uses:
    # FACTORY_PAUSED stops everything at every entry point, and
    # FACTORY_AUTOMERGE is what activates this policy in the first place.
    if: >-
      vars.FACTORY_PAUSED != 'true' &&
      vars.FACTORY_AUTOMERGE == 'true'
    timeout-minutes: 10
    steps:
      - name: Check the switches
        run: |
          if [ "${{ vars.FACTORY_PAUSED }}" = "true" ]; then
            echo "FACTORY_PAUSED=true — the factory is stopped. Exiting." >&2
            exit 0
          fi
          if [ "${{ vars.FACTORY_AUTOMERGE }}" != "true" ]; then
            echo "FACTORY_AUTOMERGE is not 'true' — the policy is inert. Nothing will merge." >&2
            exit 0
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Mint an installation token for our App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          # Matches the other factory roles (ADR 0048) so the audit trail is
          # authored by convenedos-factory[bot] rather than github-actions[bot].
          # No `contents`, so nothing here can push to any branch.
          permission-pull-requests: write

      # Bare `node`, not `pnpm tsx`: tsx is not a declared dependency, it only
      # resolves through pnpm's hidden hoist. Node 24 strips the types itself,
      # and this matches scripts/factory/attempt.ts.
      - name: Arm auto-merge on eligible dependency bumps
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run == 'true' }}
        run: node scripts/factory/automerge-run.ts