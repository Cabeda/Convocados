# The loop: a Change the Reviewer found fault with, or one whose CI went red.
#
# Two machines arguing forever is not convergence, so the loop is bounded: the
# Reviewer states findings, the Fixer answers them on the same branch, and after
# three rounds the disagreement is Cabeda's. The round count lives on GitHub
# (`scripts/factory/attempt.ts` reads it from the PR's own comments), so a run
# that dies does not get a free round. That ledger also bounds a nastier loop: a
# failing run of *this* workflow completes a check suite on the branch, which
# would re-trigger the `check_suite` path — at most three times, then it stops.
#
# Three jobs, and the split is the security model, not tidiness:
#   ledger — decides whether a round is allowed, and records it. Writes a comment.
#   round  — the agent. Its token is READ-ONLY, so nothing it can reach can push.
#   push   — a fresh write token, in a job that never runs agent-controlled code.
# Handing the agent a write token and forbidding `git push` in prose was not
# enough: the push step shares the workspace, so a `.git/hooks/pre-push` written
# by the agent executes with the token already in its environment.
name: "factory: fix loop"

on:
  # The Reviewer writes the findings marker into its review body. A review
  # without it is either clean or not about findings, and costs no run.
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to repair"
        required: true
        type: string

# One round at a time, across every Change. The Fixer is a single writer: two
# runs on the same branch race the push, and the second one loses silently.
concurrency:
  group: factory-fix-loop
  cancel-in-progress: false

# Nothing here needs the default token. The App token is minted in the job that
# writes, so its scopes are the blast radius and they are stated per run.
permissions: {}

jobs:
  # Resolve the event to a PR number and a branch, and stop early for anything
  # that is not a Fixer branch. The event's `if:` cannot make an API call, and
  # `issue_comment` has no branch in its payload.
  ledger:
    runs-on: ubuntu-latest
    if: >-
      vars.FACTORY_PAUSED != 'true' &&
      vars.FACTORY_APP_ID != '' &&
      vars.FACTORY_MODEL != '' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '<!-- factory:findings -->')) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '<!-- factory:findings -->')) ||
        (github.event_name == 'check_suite' &&
         github.event.check_suite.conclusion == 'failure' &&
         startsWith(github.event.check_suite.head_branch, 'factory/') &&
         github.event.check_suite.pull_requests[0] != null)
      )
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      branch: ${{ steps.resolve.outputs.branch }}
      run: ${{ steps.budget.outputs.run }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve the Change
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          COMMENT_PR: ${{ github.event.issue.number }}
          SUITE_PR: ${{ github.event.check_suite.pull_requests[0].number }}
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr=""
          case "$EVENT_NAME" in
            pull_request_review) pr="$REVIEW_PR" ;;
            issue_comment) pr="$COMMENT_PR" ;;
            check_suite) pr="$SUITE_PR" ;;
            workflow_dispatch) pr="$DISPATCH_PR" ;;
          esac
          if [ -z "$pr" ]; then
            echo "No pull request in this event; nothing to repair."
            exit 0
          fi
          branch="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          case "$branch" in
            factory/*) ;;
            *)
              echo "PR #$pr is on $branch — a human branch belongs to a human."
              exit 0
              ;;
          esac
          {
            echo "pr=$pr"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Check the round budget
        id: budget
        if: steps.resolve.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          if ! node scripts/factory/attempt.ts "$PR" review; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
              "factory: three fix rounds are spent. The findings that remain are a disagreement for Cabeda, not another round."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The third round's own record exits 1 (budget reached); that is the
          # ledger being honest, not a failure to repair.
          node scripts/factory/attempt.ts "$PR" review --set || true
          echo "run=true" >> "$GITHUB_OUTPUT"

  # The round itself. Read-only on purpose: this is the only job that runs code
  # shaped by the Change, so it holds no scope to write anything anywhere.
  round:
    needs: ledger
    if: needs.ledger.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The action requires a write-capable token — it configures git, opens a
    # tracking comment, and pushes the branch itself when the tree is dirty —
    # so the round cannot be read-only. What stays structural is the split: the
    # round's job never pushes, and main is protected against the App anyway.
    permissions:
      contents: write
      pull-requests: read
      issues: write
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set the committer identity
        # The action sets a global `opencode-agent[bot]` identity, and the CLA
        # check reads commit authors: a Change whose commits carry a name the
        # allowlist does not list fails the CLA and can never be merged (#1807).
        # Repo-local config wins over the action's global config.
        run: |
          git config user.name "convocarados-factory[bot]"
          git config user.email "convocarados-factory[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Mint a read token for the round
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          # The action refuses a token without write scope, so this one can
          # write; the push itself still happens in a different job, after this
          # one is gone. See the job comment.
          permission-contents: write
          permission-pull-requests: read
          permission-issues: write

      - name: Check out the Change
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ needs.ledger.outputs.pr }}
        run: |
          gh auth setup-git
          gh pr checkout "$PR" --repo "$GITHUB_REPOSITORY"

      - name: Answer the findings
        # The token lives 60 minutes and was minted above; this step must finish
        # inside that window, not the job's.
        timeout-minutes: 45
        # The round's own failure is reported by the reply file it does or does
        # not write. A red step here must not redden the checks it repairs.
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The action asserts the *actor's* write permission and skips it only
          # when TOKEN is set. A factory PR's actor is the App, whose repo
          # permission is `none` (the installation scopes do not change that),
          # so without this the reviewer cannot run on a factory Change at all.
          TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.FACTORY_MODEL }}
          agent: fixer
          share: "false"
          use_github_token: true
          prompt: |
            Repair pull request #${{ needs.ledger.outputs.pr }} as the Fixer, in repair mode.

            Follow `.opencode/agents/fixer.md`. This is one of three rounds; the round is already
            recorded on the Change. The workspace is already checked out on the Change's branch,
            and your token is read-only: commit, do not push, and do not comment.

            Read the evidence itself, never a summary:
            - a review: `gh pr view ${{ needs.ledger.outputs.pr }} --json reviews --jq '.reviews[-1].body'`
            - a red suite: `gh pr checks ${{ needs.ledger.outputs.pr }}`, then the failing job's log

            Make the smallest change that answers the findings. Re-run `bash scripts/factory/gate.sh`
            for the part you moved, then commit.

            Write `.factory-handoff/reply.md` as your last act, even when you changed nothing: that
            file is how the workflow knows the round finished, and its contents are posted to the
            Change. A round without it is treated as killed, and its work is not pushed.

      # Commit whatever the round left in the tree and bundle it, so a killed
      # round still leaves its reproduction test in the artifact — it is simply
      # not pushed, because a red partial commit would re-enter this loop and
      # spend another of the three rounds.
      - name: Package the round
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .factory-handoff
          branch="${{ needs.ledger.outputs.branch }}"
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="convocarados-factory[bot]" \
                -c user.email="convocarados-factory[bot]@users.noreply.github.com" \
                commit -m "factory: work in progress on PR #${{ needs.ledger.outputs.pr }}"
          fi
          if [ "$(git rev-list --count "origin/$branch..HEAD")" = "0" ]; then
            echo "Round made no commits."
            exit 0
          fi
          git bundle create .factory-handoff/round.bundle "origin/$branch..HEAD"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: factory-round
          path: .factory-handoff/
          # The directory is hidden and v4+ skips hidden paths by default.
          include-hidden-files: true
          if-no-files-found: warn

  # The only job that writes to GitHub. It never runs agent-controlled code: it
  # fetches the bundle as a ref and pushes that ref, so no hook written in the
  # round's workspace is in the path of the token.
  push:
    needs: [ledger, round]
    if: >-
      always() &&
      needs.ledger.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The bundle's prerequisite is the branch tip the round checked out,
          # which a shallow clone cannot satisfy.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: factory-round
          path: .factory-handoff

      - name: Mint a write token for the push
        id: push-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          # contents to push the factory/* branch, issues to post the round's
          # reply. No pull-requests write: a round reads findings, it does not
          # adjudicate them.
          permission-contents: write
          permission-issues: write

      - name: Push the round and post its reply
        env:
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
          PR: ${{ needs.ledger.outputs.pr }}
          BRANCH: ${{ needs.ledger.outputs.branch }}
          HANDOFF_DIR: .factory-handoff
        run: |
          set -euo pipefail
          if [ ! -f "$HANDOFF_DIR/reply.md" ]; then
            echo "The round did not finish; its bundle stays an artifact." >&2
            exit 0
          fi
          case "$BRANCH" in
            factory/*) ;;
            *) echo "Refusing a branch that is not factory/*: $BRANCH" >&2; exit 1 ;;
          esac

          pushed=0
          if [ -f "$HANDOFF_DIR/round.bundle" ]; then
            git fetch "$HANDOFF_DIR/round.bundle" \
              "+refs/heads/$BRANCH:refs/heads/$BRANCH"
            if [ "$(git rev-list --count "origin/$BRANCH..$BRANCH")" != "0" ]; then
              gh auth setup-git
              git push origin "$BRANCH"
              pushed=1
            fi
          fi

          if [ "$pushed" = "1" ]; then
            echo "Pushed $BRANCH." >> "$HANDOFF_DIR/reply.md"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$HANDOFF_DIR/reply.md"
