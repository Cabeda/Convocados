# The Factory: one Change per ready-for-agent Issue.
#
# The trigger is the label, and the label is Cabeda's alone — that is the whole
# human gate in the queue. The agent may not label, so it cannot re-queue itself.
name: "factory: issue"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work (it must be labelled ready-for-agent)"
        required: true
        type: string

# One run per Issue. A second run must wait, not race the first.
concurrency:
  group: factory-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  factory:
    # Everything flows through the App token minted below. The default
    # GITHUB_TOKEN needs no scope here, and must not carry one: it lives in the
    # runner's environment for the whole job, so its scopes are blast radius we
    # do not need (ADR 0046).
    permissions: {}
    # The factory is inert until its identity exists: no App id and no model
    # means step 2 is not finished, and an unconfigured run is a red run that
    # teaches nobody anything. The wizard sets both, and that is the activation.
    if: >-
      vars.FACTORY_PAUSED != 'true' &&
      vars.FACTORY_APP_ID != '' &&
      vars.FACTORY_MODEL != '' &&
      ((github.event_name == 'workflow_dispatch') ||
       contains(github.event.label.name, 'ready-for-agent'))
    runs-on: ubuntu-latest
    # Backstop only. The wall clock that matters is on the agent step below: a
    # *job* timeout kills the job and no continue-on-error can absorb that,
    # which is how a stuck agent ends up reddening a human's Change.
    timeout-minutes: 130
    steps:
      - name: Check the pause switch
        run: |
          if [ "${{ vars.FACTORY_PAUSED }}" = "true" ]; then
            echo "FACTORY_PAUSED=true — the factory is stopped. Exiting." >&2
            exit 0
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Mint an installation token for our App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          # Least privilege, stated per run: contents to push factory/*,
          # pull-requests to open Changes and comment, issues to file the
          # evidence. No workflows permission, so the factory cannot edit the
          # workflows that run it.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Run the Factory
        # The real budget. A step that times out exits non-zero, and this absorbs
        # it, so the job — and therefore the Change's check list — stays green.
        timeout-minutes: 110
        # Advisory, not a gate. The factory reviews and proposes; it never blocks
        # a human's Change. Without this, an agent that wanders until the timeout
        # below turns every PR it touches red — which is the factory sabotaging
        # the very Gates it exists to serve.
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          # Our own App's installation token, minted per run (ADR 0048) — not
          # the opencode App's OIDC exchange, whose scopes would be a third
          # party's promise instead of the deny-list we can audit (ADR 0046).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Provider credentials for vars.FACTORY_MODEL. The unset ones are empty
          # strings, which is harmless: opencode picks the one the model needs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.FACTORY_MODEL }}
          agent: factory
          # A shared session publishes the transcript, and a transcript of a
          # failing run can quote a DATABASE_URL or a token. Permanently off.
          share: "false"
          use_github_token: true
          prompt: |
            Work the Issue in this event as the Delivery Factory.

            Issue: ${{ github.event.issue.number || inputs.issue }}

            Follow `.opencode/agents/factory.md`. Branch `factory/<issue-number>-<slug>` from
            origin/main, TDD the change, run `bash scripts/factory/gate.sh` (add
            `--skip-android` only if the diff cannot touch Kotlin), push that branch, open the
            Change linked to the Issue, and end at Handoff (`factory:review` plus a summary
            comment) or Blocked (`factory:blocked` plus the evidence).

            Do not merge, do not label, do not touch a human branch. If the Issue has no
            verifiable acceptance criterion, that is Blocked, not a licence to improvise.
