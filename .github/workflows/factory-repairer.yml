# The Repairer: CI went red on a Change the Factory made.
#
# Scoped to factory/* branches on purpose: a red check on a human branch belongs
# to a human. check_suite carries the branch, so the filter needs no API call.
name: "factory: repair"

on:
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to repair"
        required: true
        type: string

# Everything flows through the App token minted in the job below. The
# default GITHUB_TOKEN needs no scope and must not carry one: it sits in
# the runner environment for the whole run, so its scopes are blast radius
# we never asked for (ADR 0046).
permissions: {}

jobs:
  repairer:
    # The factory is inert until its identity exists: no App id and no model
    # means step 2 is not finished, and an unconfigured run is a red run that
    # teaches nobody anything. The wizard sets both, and that is the activation.
    # Two filters, and the second one matters as much as the first: a red suite
    # on ANY `factory/*` branch is not the Repairer's business. Without it, a
    # stale branch nobody is working on — or one the factory cannot even push to
    # — spends a full agent run per failing check suite. The branch must be one
    # this Issue queued.
    if: >-
      vars.FACTORY_PAUSED != 'true' &&
      vars.FACTORY_APP_ID != '' &&
      vars.FACTORY_MODEL != '' &&
      ((github.event_name == 'workflow_dispatch') ||
       (github.event.action == 'completed' &&
        github.event.check_suite.conclusion == 'failure' &&
        startsWith(github.event.check_suite.head_branch, 'factory/') &&
        github.event.check_suite.pull_requests[0] != null &&
        contains(
          github.event.check_suite.head_branch,
          format('factory/{0}-', github.event.check_suite.pull_requests[0].number)
        )))
    runs-on: ubuntu-latest
    # Backstop only. The wall clock that matters is on the agent step below: a
    # *job* timeout kills the job and no continue-on-error can absorb that,
    # which is how a stuck agent ends up reddening a human's Change.
    timeout-minutes: 70
    steps:
      - name: Check the pause switch
        run: |
          if [ "${{ vars.FACTORY_PAUSED }}" = "true" ]; then
            echo "FACTORY_PAUSED=true — the factory is stopped. Exiting." >&2
            exit 0
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Mint an installation token for our App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          # Least privilege, stated per run: contents to push factory/*,
          # pull-requests to open Changes and comment, issues to file the
          # evidence. No workflows permission, so the factory cannot edit the
          # workflows that run it.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Repair the red Gate
        # The real budget. A step that times out exits non-zero, and this absorbs
        # it, so the job — and therefore the Change's check list — stays green.
        timeout-minutes: 50
        # Advisory, not a gate: see factory-issue.yml for why.
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Provider credentials for vars.FACTORY_MODEL. The unset ones are empty
          # strings, which is harmless: opencode picks the one the model needs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.FACTORY_MODEL }}
          agent: repairer
          share: "false"
          use_github_token: true
          prompt: |
            Repair the red Gate on pull request #${{ github.event.pull_request.number || inputs.pr }},
            following `.opencode/agents/repairer.md`.

            Read the failing Gate's log before forming a theory. Check the budget first:
            `node scripts/factory/attempt.ts <pr> <gate>`; if the 3 Attempts for that Gate are
            spent, label the Issue `factory:blocked` with the evidence and stop.

            Fix the cause. Never make a Gate pass by changing the measurement: no deleted or
            skipped tests, no lowered thresholds, no loosened assertions, no new coverage
            excludes. Re-run that Gate locally before pushing to the same `factory/*` branch.
