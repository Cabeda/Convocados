# The Reviewer: every open Change, machine or human, judged against the Mission.
#
# It watches human PRs too. A review that only inspects machine work is a
# rubber stamp (docs/factory/CONTEXT.md).
name: "factory: review"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A `pull_request` run cannot read a factory Change: the agent action asserts
  # the *actor's* repo permission, and a branch the App pushed has the App as
  # actor, whose permission is `none`. A scheduled run's actor is the human who
  # last touched this file, so the schedule is how machine Changes get read.
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [factory-review]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request to review. Empty picks the oldest unread factory Change."
        required: false
        type: string

# One review at a time, never two. Serialised rather than cancel-in-progress:
# the janitor dispatches `factory-review` twice per tick, so cancelling the
# in-flight run lets a tick kill the review it just picked — observed 2026-11-27
# on #1881, where a 45-second-old review was cancelled and wrote no verdict.
# Queueing wastes at most one run; cancelling loses the work and posts nothing.
concurrency:
  group: factory-review
  cancel-in-progress: false

# Everything flows through the App token minted in the job below. The
# default GITHUB_TOKEN needs no scope and must not carry one: it sits in
# the runner environment for the whole run, so its scopes are blast radius
# we never asked for (ADR 0046).
permissions: {}

jobs:
  # Who to read. For a `pull_request` event it is the event's own number; on a
  # schedule it is the oldest factory Change with no review naming its head.
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pick the Change
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # The picker verifies the Reviewer's signature, so a forged marker
          # cannot make it skip a Change it should read.
          FACTORY_APP_KEY: ${{ secrets.FACTORY_APP_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "pr=$EVENT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${DISPATCH_PR:-}" ]; then
            echo "pr=$DISPATCH_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/factory/next-review.ts

  reviewer:
    needs: pick
    # The factory is inert until its identity exists: no App id and no model
    # means step 2 is not finished, and an unconfigured run is a red run that
    # teaches nobody anything. The wizard sets both, and that is the activation.
    #
    # Three exemptions, all facts about the event rather than conveniences:
    #   * Dependabot — a run started by a Dependabot PR receives no repository
    #     secrets, so `FACTORY_APP_KEY` is absent and the token step fails. That
    #     is the same constraint the sweeper dodges by running on a schedule.
    #     Nothing is lost: a bump's review is the gates, and the mission lens has
    #     nothing to judge in a version string.
    #   * Forks — the same secretless run, for the same reason. This is a reach
    #     gap, not a policy: a forked Change goes unreviewed. The Sweeper flags a
    #     *stale* one from its schedule; an active, green fork PR gets no factory
    #     attention at all (docs/factory/README.md → Reach).
    #   * Drafts — `opened` fires on a draft too, so an unfinished Change paid
    #     for a full review and then paid again on `ready_for_review`.
    #   * Factory-authored Changes — the agent action asserts the *actor's* repo
    #     permission, and a push by the App makes the App the actor, whose
    #     permission is `none`. The `pull_request` run therefore dies in two
    #     seconds without reading the diff, and leaves a permanently red
    #     `reviewer` check on a head that a scheduled run then reviews fine.
    #     Skip on the actor, which is what the failure is about: a human who
    #     pushes to a factory branch is a human actor and can be reviewed here.
    # Name Dependabot exactly, not "any bot": `factory/*` Changes are authored by
    # the factory App and must still be reviewed — they are this role's customer.
    if: >-
      needs.pick.outputs.pr != '' &&
      vars.FACTORY_PAUSED != 'true' &&
      vars.FACTORY_APP_ID != '' &&
      vars.FACTORY_MODEL != '' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.actor != 'convocarados-factory[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    # Backstop only. The wall clock that matters is on the agent step below: a
    # *job* timeout kills the job and no continue-on-error can absorb that,
    # which is how a stuck agent ends up reddening a human's Change.
    timeout-minutes: 40
    steps:
      - name: Check the pause switch
        run: |
          if [ "${{ vars.FACTORY_PAUSED }}" = "true" ]; then
            echo "FACTORY_PAUSED=true — the factory is stopped. Exiting." >&2
            exit 0
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set the committer identity
        # The action commits whatever the agent leaves in the tree — now
        # including the Reviewer's verdict file — so every agent workflow needs
        # an identity, and the CLA must exempt it (#1807).
        run: |
          git config user.name "convocarados-factory[bot]"
          git config user.email "convocarados-factory[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Mint an installation token for our App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # `app-id` is deprecated in v3; GitHub accepts the App ID as the JWT
          # issuer under the new name, so no new variable is needed.
          client-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          # The action refuses to start on a token without contents write, and
          # a factory PR's actor is the App, whose repo permission is `none` —
          # so this role is only reachable with a write token plus TOKEN. The
          # review itself still writes nothing: its permission block denies
          # edits and every push. No workflows permission, so the factory cannot
          # edit the workflows that run it.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Review the Change
        # 20. The 12-minute cap was fitted to docs-only diffs (3-5 min) and killed
        # real code reviews mid-exploration: run 46071914557 was still reading
        # `cancelEvent.server.ts` at 11 minutes and wrote no verdict, which the
        # gate reads as "no review has named its head". 20 leaves room for a code
        # diff while still halving the old 25, and the prompt below keeps the
        # exploration bounded.
        # A step that times out exits non-zero, and `continue-on-error` absorbs
        # it, so the job stays green and the verdict step reports the miss.
        timeout-minutes: 20
        # Advisory, not a gate: see factory-issue.yml for why.
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The action asserts the *actor's* write permission and skips it only
          # when TOKEN is set. A factory PR's actor is the App, whose repo
          # permission is `none` (installation scopes do not change that), so
          # without this the reviewer cannot run on a factory Change at all.
          TOKEN: ${{ steps.app-token.outputs.token }}
          # Provider credentials for vars.FACTORY_MODEL. The unset ones are empty
          # strings, which is harmless: opencode picks the one the model needs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.FACTORY_MODEL }}
          agent: reviewer
          share: "false"
          use_github_token: true
          prompt: |
            Review pull request #${{ needs.pick.outputs.pr }} as the Delivery Factory's
            Reviewer, following `.opencode/agents/reviewer.md`.

            Start with the mission question in your comment: does this let people play more, with
            less administration? Then review against the Mission and Core Principles — not against
            the Gates, which already passed. Report findings with `path:line` and the concrete
            failure each one causes. Treat migrations, auth and tokens, the scheduler, workflows
            and deploy config, and coverage-threshold edits as Hard Block: report, do not judge.

            Start from `gh pr diff <number>` and open only the files the diff names, one read
            each. Do not survey the repository: the Change is the subject, and exploring past it
            spends the review's minutes without changing the verdict.

            Do not install, build, or run anything: no `pnpm install`, `pnpm test`, `pnpm typecheck`,
            Gradle, Playwright or Lighthouse. Those results already exist as checks on the Change and
            reading them is free; producing them again spends the review's minute budget and is not
            review. Read the diff and the files it names, then argue.

            You may not approve, merge, push, or touch a human branch: the Fixer writes, you judge.
            Put `<!-- factory:findings -->` on its own line in the body when it carries at least one
            finding — that marker starts the Fixer's next round. Do not write the verdict or reviewed
            markers: the workflow appends them, signed.

            Do not post the review yourself. Write its body to `.factory-review/review.md` and the
            word (`approve` or `refuse`) to `.factory-review/verdict`; the workflow signs the head
            and your verdict with a key your job never sees, appends both markers, and posts. Write
            the verdict first: a run that dies while writing the body then leaves nothing to post,
            and the check fails — the honest reading of a timeout.

      - name: Sign and post the review
        # The agent writes the body; this step signs the head with the App key,
        # appends both markers, and posts. The Fixer's job never holds the key,
        # so a prompt-injected Fixer cannot write an approval the gate accepts.
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_KEY: ${{ secrets.FACTORY_APP_KEY }}
          PR: ${{ needs.pick.outputs.pr }}
        run: |
          set -euo pipefail
          body=.factory-review/review.md
          verdict="$(cat .factory-review/verdict 2>/dev/null || echo "")"
          if [ ! -f "$body" ]; then
            # Nothing to post. This is not a merge decision: the gate reads the
            # signed verdict marker, and a review that wrote none is `no review
            # has named its head` — a refusal it reaches on its own. Failing the
            # step instead reddened `reviewer` on every open Change, which read
            # as "all PRs are broken" while telling the gate nothing new.
            echo "::warning title=Review did not finish::The Reviewer wrote no body and no verdict. The merge gate treats a missing verdict as a refusal."
            exit 0
          fi
          case "$verdict" in
            approve|refuse) ;;
            *) echo "No verdict; posting the body without a marker." >&2 ;;
          esac
          head="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          # Sign head **and** verdict: a refusal's signature replayed with an
          # approve marker was a real hole in the first draft.
          sig="$(printf '%s' "$head|$verdict" | openssl dgst -sha256 -hmac "$APP_KEY" -hex | awk '{print $NF}')"
          {
            cat "$body"
            echo
            if [ -n "$verdict" ]; then echo "<!-- factory:verdict:$verdict -->"; fi
            echo "<!-- factory:reviewed:$head:$sig -->"
          } > .factory-review/post.md
          # Post as a comment, always. GitHub refuses a review on a PR the App
          # authored, so the comment fallback was already the only path that
          # worked for every machine Change — and a formal review lands in a
          # separate tab that the conversation never shows. The adversarial
          # review is the point: it belongs in the thread a human reads.
          # The daemon reads both surfaces, so nothing downstream changes.
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file .factory-review/post.md

      - name: Record the verdict
        # This check IS the gate: `reviewer` is a required status check, so a
        # refusal must fail it. Anything else makes "Verdict: refuse" a comment
        # next to a green tick, which is a review nobody has to answer.
        #
        # A missing verdict fails too. Silence is not approval, and a Change
        # whose review never finished has not been read.
        if: always()
        id: verdict
        run: |
          set -euo pipefail
          verdict="$(cat .factory-review/verdict 2>/dev/null || echo "")"
          case "$verdict" in
            approve) echo "::notice title=Reviewer::approve" ;;
            refuse)
              echo "::error title=Reviewer::refuse — the findings are in the review comment"
              exit 1
              ;;
            *)
              echo "::error title=Reviewer::no verdict was written — the review did not finish"
              exit 1
              ;;
          esac
