# The Reviewer: every open Change, machine or human, judged against the Mission.
#
# It watches human PRs too. A review that only inspects machine work is a
# rubber stamp (docs/factory/CONTEXT.md).
name: "factory: review"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Everything flows through the App token minted in the job below. The
# default GITHUB_TOKEN needs no scope and must not carry one: it sits in
# the runner environment for the whole run, so its scopes are blast radius
# we never asked for (ADR 0046).
permissions: {}

jobs:
  reviewer:
    # The factory is inert until its identity exists: no App id and no model
    # means step 2 is not finished, and an unconfigured run is a red run that
    # teaches nobody anything. The wizard sets both, and that is the activation.
    if: >-
      vars.FACTORY_PAUSED != 'true' &&
      vars.FACTORY_APP_ID != '' &&
      vars.FACTORY_MODEL != ''
    runs-on: ubuntu-latest
    # A stuck agent must not burn an hour of runner time. Below this cap the
    # step's non-zero exit is absorbed by continue-on-error, which is what keeps
    # a factory timeout from ever turning a human's PR red.
    timeout-minutes: 30
    steps:
      - name: Check the pause switch
        run: |
          if [ "${{ vars.FACTORY_PAUSED }}" = "true" ]; then
            echo "FACTORY_PAUSED=true — the factory is stopped. Exiting." >&2
            exit 0
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Mint an installation token for our App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          # Least privilege, stated per run: contents to push factory/*,
          # pull-requests to open Changes and comment, issues to file the
          # evidence. No workflows permission, so the factory cannot edit the
          # workflows that run it.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Review the Change
        # Advisory, not a gate: see factory-issue.yml for why.
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Provider credentials for vars.FACTORY_MODEL. The unset ones are empty
          # strings, which is harmless: opencode picks the one the model needs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.FACTORY_MODEL }}
          agent: reviewer
          share: "false"
          use_github_token: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} as the Delivery Factory's
            Reviewer, following `.opencode/agents/reviewer.md`.

            Start with the mission question in your comment: does this let people play more, with
            less administration? Then review against the Mission and Core Principles — not against
            the Gates, which already passed. Report findings with `path:line` and the concrete
            failure each one causes. Treat migrations, auth and tokens, the scheduler, workflows
            and deploy config, and coverage-threshold edits as Hard Block: report, do not judge.

            You may push fixes to `factory/*` branches only, and only for findings that are
            unambiguous defects. You may not approve, merge, or touch a human branch.
