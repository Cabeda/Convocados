name: List Play Tracks

# Diagnostic: lists the real Play Developer API track IDs for the app, including
# per-form-factor tracks (Wear OS). Console display names can differ from the API
# track ID, which is why a promotion can 404 with "Track not found".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    name: List tracks
    runs-on: ubuntu-latest
    steps:
      - name: List tracks for com.cabeda.Convocados
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth
          python3 - <<'PY'
          import json, os, urllib.request
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SA_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          creds.refresh(Request())

          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.cabeda.Convocados"

          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, method=method, data=data)
              req.add_header("Authorization", "Bearer " + creds.token)
              with urllib.request.urlopen(req) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else None

          edit = call("POST", base + "/edits")["id"]
          tracks = call("GET", f"{base}/edits/{edit}/tracks")
          print("Track IDs:")
          for t in tracks.get("tracks", []):
              versions = [r.get("versionCodes") for r in t.get("releases", [])]
              print(f'  {t["track"]}  (formFactor={t.get("formFactor", "DEFAULT")})  releases={versions}')
          call("DELETE", f"{base}/edits/{edit}")
          PY
