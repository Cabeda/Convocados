# Preview deploy worker — triggered by preview.yml via repository_dispatch
# after its authorization gate passes.
#
# Why repository_dispatch: it can only be sent by actors with repo write
# access (the gated workflow or a maintainer), so this workflow's checkout is
# never adjacent to an attacker-controlled event — CodeQL's
# actions/untrusted-checkout rule does not apply, and actions/checkout v7's
# fork-refusal does not fire here, so forked contributors' PRs are reachable.
#
# Defense in depth: the allowlist gate is re-run inside this workflow against
# fresh CODEOWNERS before any untrusted code is fetched.
#
# See ADR 0022 and docs/runbooks/preview-deployments.md.

name: Preview Deploy

on:
  repository_dispatch:
    types: [convocados-preview]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
  FLY_ORG: personal # Fly org that hosts preview apps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Trusted checkout of the default branch — provides CODEOWNERS and the
      # shared gate script. Untrusted code is fetched only after this.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Re-authorize request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by }}
        run: .github/scripts/preview-authorize.sh

      # Untrusted PR head. Raw git rather than actions/checkout: this trigger
      # carries no attacker-controlled event context (the gate already ran),
      # so no pwn-request guard is needed or applicable here.
      - name: Fetch PR head
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/pull/${{ steps.gate.outputs.pr_number }}/head"
          git checkout FETCH_HEAD

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if missing
        run: |
          APP="${{ steps.gate.outputs.app_name }}"
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org "$FLY_ORG"
          fi

      # Staged so it is applied by the deploy below; deterministic across
      # redeploys, so auth sessions survive pushes to the same PR.
      - name: Stage preview auth secret
        env:
          PREVIEW_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
        run: |
          if [ -z "$PREVIEW_SECRET" ]; then
            echo "::error::Repository secret PREVIEW_BETTER_AUTH_SECRET is not configured."
            exit 1
          fi
          printf '%s' "$PREVIEW_SECRET" | flyctl secrets set BETTER_AUTH_SECRET=- \
            --stage --app "${{ steps.gate.outputs.app_name }}"

      - name: Deploy preview
        run: |
          flyctl deploy --remote-only \
            --config .fly/preview.toml \
            --app "${{ steps.gate.outputs.app_name }}" \
            --env "BETTER_AUTH_URL=${{ steps.gate.outputs.app_url }}" \
            --strategy immediate \
            --wait-timeout 300

      - name: Report success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const upsertPreviewComment = async (gh, repo, issueNumber, marker, body) => {
              const comments = await gh.rest.issues.listComments({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.data.find((c) => c.body?.includes(marker));
              if (existing) {
                await gh.rest.issues.updateComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await gh.rest.issues.createComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            };
            const url = '${{ steps.gate.outputs.app_url }}';
            const marker = '<!-- convocados-preview -->';
            const body = [
              marker,
              ':white_check_mark: **Preview deployed**',
              '',
              `- :link: ${url}`,
              '- :deciduous_tree: Deployed from the current PR head',
              '- :wastebasket: Destroyed automatically when this PR closes (`/preview-stop` to stop early)',
              '',
              '_Preview data is ephemeral and disposable — do not enter real credentials or personal data._',
            ].join('\n');
            await upsertPreviewComment(
              github,
              { repo: context.repo },
              Number('${{ steps.gate.outputs.pr_number }}'),
              marker,
              body,
            );

      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const upsertPreviewComment = async (gh, repo, issueNumber, marker, body) => {
              const comments = await gh.rest.issues.listComments({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.data.find((c) => c.body?.includes(marker));
              if (existing) {
                await gh.rest.issues.updateComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await gh.rest.issues.createComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            };
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + context.repo.owner +
              '/' + context.repo.repo + '/actions/runs/' + process.env.GITHUB_RUN_ID;
            const body = ':x: **Preview deployment failed** — check ' +
              'the [workflow run](' + runUrl + ') for logs.';
            await upsertPreviewComment(
              github,
              { repo: context.repo },
              Number('${{ steps.gate.outputs.pr_number }}'),
              '<!-- convocados-preview -->',
              body,
            );
