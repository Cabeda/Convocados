# Reusable preview deploy workflow — called by preview.yml after its
# authorization gate passes. Kept separate so the privileged
# pull_request_target / issue_comment trigger never coexists with the
# untrusted PR-head checkout in one workflow definition (CodeQL
# actions/untrusted-code-checkout), and so this workflow can declare the
# minimal permissions it actually needs.
#
# See ADR 0022 and docs/runbooks/preview-deployments.md.

name: Preview Deploy

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number whose head should be deployed
        required: true
        type: number
      app_name:
        description: Fly app name (convocados-pr-<pr_number>)
        required: true
        type: string
      app_url:
        description: Public preview URL (https://<app_name>.fly.dev)
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
  FLY_ORG: personal # Fly org that hosts preview apps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Gate already passed in the caller. Safe to check out untrusted code.
      #
      # allow-unsafe-pr-checkout is required for this review-app flow to reach
      # fork PRs at all (checkout v7 refuses them here by default). It is a
      # deliberate, reviewed opt-in: the authorization gate in preview.yml has
      # already restricted deploys to the repo owner and .github/CODEOWNERS
      # members, and nothing from the checkout is executed on this runner —
      # the image build happens on Fly's remote builder (ADR 0022).
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if missing
        run: |
          APP="${{ inputs.app_name }}"
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org "$FLY_ORG"
          fi

      # Staged so it is applied by the deploy below; deterministic across
      # redeploys, so auth sessions survive pushes to the same PR.
      - name: Stage preview auth secret
        env:
          PREVIEW_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
        run: |
          if [ -z "$PREVIEW_SECRET" ]; then
            echo "::error::Repository secret PREVIEW_BETTER_AUTH_SECRET is not configured."
            exit 1
          fi
          printf '%s' "$PREVIEW_SECRET" | flyctl secrets set BETTER_AUTH_SECRET=- \
            --stage --app "${{ inputs.app_name }}"

      - name: Deploy preview
        run: |
          flyctl deploy --remote-only \
            --config .fly/preview.toml \
            --app "${{ inputs.app_name }}" \
            --env "BETTER_AUTH_URL=${{ inputs.app_url }}" \
            --strategy immediate \
            --wait-timeout 300

      - name: Report success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ inputs.app_url }}';
            const marker = '<!-- convocados-preview -->';
            const body = [
              marker,
              ':white_check_mark: **Preview deployed**',
              '',
              `- :link: ${url}`,
              '- :deciduous_tree: Deployed from the current PR head',
              '- :wastebasket: Destroyed automatically when this PR closes (`/preview-stop` to stop early)',
              '',
              '_Preview data is ephemeral and disposable — do not enter real credentials or personal data._',
            ].join('\n');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + context.repo.owner +
              '/' + context.repo.repo + '/actions/runs/' + process.env.GITHUB_RUN_ID;
            const body = ':x: **Preview deployment failed** — check ' +
              'the [workflow run](' + runUrl + ') for logs.';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = '<!-- convocados-preview -->';
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
