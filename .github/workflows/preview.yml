# Preview deployments (Fly.io review apps) — see ADR 0022 and
# docs/runbooks/preview-deployments.md.
#
# Model: opt-in per PR via comment commands.
#   /preview        deploy current PR head to https://convocados-pr-<N>.fly.dev
#   /preview-stop   tear the preview down early
# Previews are destroyed automatically when the PR closes.
#
# Security model:
# - `pull_request_target` / `issue_comment` run in the base-repo context with
#   access to secrets, so every request passes an authorization gate BEFORE any
#   untrusted PR code is checked out.
# - Gate = strict allowlist: repository OWNER association OR a username listed
#   in .github/CODEOWNERS (usernames only; teams/emails are not resolved).
# - BOTH the PR author AND the commenter must pass the gate — a trusted
#   maintainer cannot be social-engineered into deploying untrusted fork code.
# - Deployment happens in preview-deploy.yml, triggered via
#   repository_dispatch: a trusted-actor event that never carries
#   attacker-controlled context. That workflow re-runs the allowlist gate
#   (defense in depth) before fetching untrusted PR code.
# - Secrets used here are preview-scoped (FLY_PREVIEW_TOKEN) and never reach
#   the deployed app; previews get their own throwaway auth secret.

name: Preview Deployment

on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write # repository_dispatch to hand off to the deploy workflow
  issues: write
  pull-requests: write

env:
  FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
  FLY_ORG: personal # Fly org that hosts preview apps

jobs:
  # ── Authorization gate ────────────────────────────────────────────────────────
  authorize:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      command: ${{ steps.cmd.outputs.command }}
      pr_number: ${{ steps.cmd.outputs.pr_number }}
    steps:
      # Base branch checkout only — trusted CODEOWNERS source. No PR code yet.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse command
        id: cmd
        env:
          BODY: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMAND=none
          if [ "$IS_PR" = "true" ]; then
            case "$BODY" in
              "/preview-stop"*|"/preview stop"*) COMMAND=/preview-stop ;;
              "/preview"*)                       COMMAND=/preview ;;
            esac
          fi
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check allowlist
        id: gate
        env:
          AUTHOR: ${{ github.event.issue.user.login }}       # PR author
          COMMENTER: ${{ github.event.comment.user.login }}  # who typed the command
          AUTHOR_ASSOC: ${{ github.event.issue.author_association }}
          COMMENTER_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          allowed_by() {
            local user="$1" assoc="$2"
            [ "$assoc" = "OWNER" ] && return 0
            while IFS= read -r entry; do
              entry="${entry#@}"
              [ "${entry,,}" = "${user,,}" ] && return 0
            done < <(grep -vE '^\s*#' .github/CODEOWNERS | grep -oE '@[a-zA-Z0-9][a-zA-Z0-9_-]*' | sort -fu)
            return 1
          }
          ALLOWED=false
          if allowed_by "$AUTHOR" "$AUTHOR_ASSOC" && allowed_by "$COMMENTER" "$COMMENTER_ASSOC"; then
            ALLOWED=true
          fi
          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR allowed_by_gate=$(allowed_by "$AUTHOR" "$AUTHOR_ASSOC" && echo yes || echo no)"
          echo "commenter=$COMMENTER allowed_by_gate=$(allowed_by "$COMMENTER" "$COMMENTER_ASSOC" && echo yes || echo no)"

      - name: Acknowledge request
        if: steps.cmd.outputs.command != 'none'
        uses: actions/github-script@v8
        with:
          script: |
            const emoji = '${{ steps.gate.outputs.allowed }}' === 'true' ? 'eyes' : 'no_entry';
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: emoji,
            });

  # ── Reject unauthorized requests ─────────────────────────────────────────────
  reject-unauthorized:
    needs: authorize
    if: needs.authorize.outputs.command == '/preview' && needs.authorize.outputs.allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post gated notice
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ':no_entry: Preview deployments are limited to the repository ' +
                    'owner and members listed in `.github/CODEOWNERS`. Ask a maintainer ' +
                    'to add you there to unlock `/preview`.',
            });

  # ── Deploy (delegated via repository_dispatch) ────────────────────────────────
  # The privileged trigger never checks out untrusted code here; the worker
  # workflow (preview-deploy.yml) re-runs the allowlist gate before fetching
  # the PR head. See .github/workflows/preview-deploy.yml and ADR 0022.
  request-deploy:
    needs: authorize
    if: needs.authorize.outputs.command == '/preview' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          REQUESTED_BY: ${{ github.event.comment.user.login }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=convocados-preview \
            -F "client_payload[pr_number]=$PR_NUMBER" \
            -f "client_payload[requested_by]=$REQUESTED_BY"

  # ── Teardown: explicit command ───────────────────────────────────────────────
  destroy-on-command:
    needs: authorize
    if: needs.authorize.outputs.command == '/preview-stop' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy preview app
        run: |
          APP="convocados-pr-${{ needs.authorize.outputs.pr_number }}"
          flyctl apps destroy "$APP" --yes || true
          echo "Destroyed $APP"

  # ── Teardown: automatic on PR close ──────────────────────────────────────────
  destroy-on-close:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy preview app
        run: |
          APP="convocados-pr-${{ github.event.pull_request.number }}"
          flyctl apps destroy "$APP" --yes || true
          echo "Destroyed $APP (PR closed)"
