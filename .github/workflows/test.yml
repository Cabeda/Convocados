name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # `labeled`/`unlabeled` re-run the job so applying the `no-issue` hatch can
    # turn it green; `edited` re-checks a body changed after it passed green (the
    # #1114/#1199 failure mode). opened/synchronize/reopened are the defaults.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
  # Merge queue: required checks run against the queued merge result, so a
  # combination that only breaks after merging is caught before it lands.
  merge_group:
    types: [checks_requested]

# Cancel in-progress runs for the same ref when a new push lands.
# Saves CI minutes when a developer pushes repeatedly to the same branch.
# Never cancel a merge-queue run: GitHub re-queues on cancellation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  # ── Static analysis: typecheck, lint (parallel) ──────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint

  # ── Dependency audit: fail on high/critical vulns ─────────────────────────
  # Reads pnpm-lock.yaml only — no install needed, so this job is ~10s.
  # Gate at "high" to keep signal; moderate/low noise tracked separately.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level high

  # ── PR hygiene: every PR must name the issue it closes ───────────────────
  # GitHub closes an issue only when the PR body carries a closing keyword
  # ("Closes #123"). Without one the issue lingers open after the fix ships, and
  # stale open state misleads the next reader (it cost a session: #1114 closed
  # by hand 20h after its merge, #1199 11 days after). `no-issue` is the escape
  # hatch, for a PR that genuinely closes nothing. The check itself is a module
  # (scripts/check-pr-closing-keyword.mjs) with unit tests, so a regex typo here
  # cannot ship green.
  pr-links-issue:
    name: PR Links Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Check the PR body names the issue it closes
        env:
          # Passed via env, never interpolated into the shell — body text is
          # untrusted input.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-pr-closing-keyword.mjs

  # ── Ledger integrity: a union merge can splice duplicate task lines ───────
  # .dex/tasks.jsonl is merge=union, so a rebase/merge across main can duplicate
  # lines without a conflict (it did: 197 duplicate lines). The same check runs
  # in the pre-push hook and is documented in AGENTS.md — keep the three in step.
  dex-ledger:
    name: Dex Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/dex-dedupe.mjs --check

  # ── Seed smoke: catches dev-script breakage fast ────────────────────────
  # Runs against a throwaway DB so the seed script can't pass by reusing
  # stale state. pnpm + tsx resolution has bitten us before — keep this
  # under 3 min so it stays cheap on the free tier.
  seed-smoke:
    name: DB Seed Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare throwaway DB
        env:
          DATABASE_URL: file:./seed-smoke.db
          BETTER_AUTH_URL: http://localhost:4321
        run: pnpm prisma migrate deploy
      - name: Generate Prisma client
        env:
          DATABASE_URL: file:./seed-smoke.db
        run: pnpm prisma generate
      - name: Run seed
        env:
          DATABASE_URL: file:./seed-smoke.db
          BETTER_AUTH_URL: http://localhost:4321
        run: pnpm db:seed

  # ── Unit + integration tests ────────────────────────────────────────────
  # Split by vitest project, then shard each. Plain --shard=N/4 split by file
  # count and clustered the slow jsdom/MUI component files into one shard
  # (66s vs 25s siblings). node project = many fast suites (2 shards);
  # jsdom = few heavy component suites (3 shards). Wall time = setup (~30s)
  # + slowest leg. Shards never run coverage: each leg sees only its slice,
  # so global thresholds would fail every leg. Coverage runs unsharded in
  # the coverage-gate job below, where vitest's own threshold check sees
  # the whole suite.
  test:
    name: Test (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: node, shard: 1, total: 4 }
          - { project: node, shard: 2, total: 4 }
          - { project: node, shard: 3, total: 4 }
          - { project: node, shard: 4, total: 4 }
          - { project: jsdom, shard: 1, total: 3 }
          - { project: jsdom, shard: 2, total: 3 }
          - { project: jsdom, shard: 3, total: 3 }

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No `cache: pnpm` here — node_modules cache below already covers
          # installs; downloading the pnpm store too costs 9-13s per leg.
          cache-dependency-path cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Prisma client for test shards
        run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - name: Run tests (no coverage — sharded legs see partial suites) — ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
        run: pnpm vitest run --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=test-results.json
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Report flaky tests (${{ matrix.project }} ${{ matrix.shard }})
        if: always()
        run: node scripts/report-flaky.mjs test-results.json || true

  # Coverage threshold gate (only on push). Runs the FULL suite unsharded so
  # vitest's own thresholds (vitest.config.ts, single source of truth) see
  # complete per-file coverage. Never shard this: a shard only exercises part
  # of the suite and would fail global thresholds against partial data.
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      # Always generate: the node_modules cache key includes the Prisma schema,
      # but a restored cache has been observed to miss src/lib/__generated__,
      # which silently breaks every test that imports db.server. Generating is
      # idempotent and cheap, so never rely on the cache for it.
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - name: Run full suite with coverage (thresholds from vitest.config.ts)
        run: pnpm vitest run --coverage --reporter=default

  # ── Build (needed for E2E) ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
          retention-days: 1

  # ── Lighthouse — only on push to main, not on PRs ────────────────────────
  # Optimized for <60s: single run, single URL on fast path, reuses build artifact,
  # caches node_modules. Full 3×3 runs only when LHCI_FULL=1 (manual).
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/
      - name: Prepare database for Lighthouse
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: file:./ci-test.db
      - name: "Run Lighthouse CI (fast: 1 run x 1 URL)"
        run: pnpm lhci
        env:
          LHCI_FAST: "1"

  # ── E2E tests ──────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    # `playwright install-deps` runs apt-get on every run and is not cached;
    # a slow Ubuntu mirror spent 9m30s of a 10m budget and had the job killed
    # mid-install (run 39802793041).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm playwright --version)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-${{ runner.os }}-chromium
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install chromium
      - name: Install Playwright system deps
        run: pnpm playwright install-deps chromium
      - name: Run E2E tests
        run: pnpm playwright test
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  check-android:
    name: Check Android Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android-app/**'

  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: check-android
    # main always compiles, whatever the diff: a push that does not touch
    # android-app/ used to skip this job, and `skipped` passed ci-gate, so
    # main could sit broken until some unrelated PR happened to touch Android.
    if: needs.check-android.outputs.android == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create placeholder google-services.json
        working-directory: android-app
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.cabeda.Convocados" } }, "api_key": [{ "current_key": "placeholder" }] }],
            "configuration_version": "1"
          }
          EOF

      # Lint compiles nothing, so it is cheap next to the build it sits beside,
      # and it is the only thing that reads the rules `assembleDebug` cannot see.
      - name: Lint phone
        working-directory: android-app
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build phone debug APK
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --no-daemon

      # assembleDebug does not compile test sources, so a broken unit test only
      # surfaced later in the release job's publish path. Compile them here too.
      - name: Compile phone unit tests
        working-directory: android-app
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon

  android-wear:
    name: Wear OS Build
    runs-on: ubuntu-latest
    needs: check-android
    if: needs.check-android.outputs.android == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure local.properties
        working-directory: android-app
        run: echo "GOOGLE_SERVER_CLIENT_ID=placeholder.apps.googleusercontent.com" > local.properties

      # Wear lint had no guardrail at all: `assembleDebug` compiles, it does not
      # lint, so a WrongConstant sat on main for months with nothing reading it.
      # Lint runs here rather than in a new job, because the build this already
      # pays for is the one lint needs. `:app:lintDebug` is deliberately absent —
      # it reports 49 pre-existing errors (see the dex issue) and cannot gate
      # until those are triaged.
      - name: Lint Wear OS
        working-directory: android-app
        run: ./gradlew :wear:lintDebug --no-daemon

      - name: Build Wear OS debug APK
        working-directory: android-app
        run: ./gradlew :wear:assembleDebug --no-daemon

      # Stands alone so the unit suite stays gated if the screenshot step is ever
      # retouched. verifyRoborazziDebug also runs it, but only as a side effect,
      # and a side effect is a dependency nobody can see.
      - name: Run Wear unit tests
        working-directory: android-app
        run: ./gradlew :wear:testDebugUnitTest --no-daemon

      # Fails if a round/square screenshot drifted — the regression gate for
      # Play's "Watch shapes" requirement.
      - name: Verify Wear screenshots (round + square)
        working-directory: android-app
        run: ./gradlew :wear:verifyRoborazziDebug --no-daemon



  # ── Gate job: single required status check for branch protection ─────────
  # Branch protection requires a check named "CI". This job depends on all
  # the real jobs and reports a single pass/fail status.
  ci-gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, lint, audit, test, coverage-gate, build, e2e, seed-smoke, android, android-wear, dex-ledger, pr-links-issue]
    steps:
      # The gate's logic lives in scripts/ci-gate.sh so src/test/ci-gate.test.ts
      # can exercise it: a red "CI" that does not say *which* job went red sends
      # whoever is reading it hunting through twenty green rows to find the one
      # that is not — the gate's whole job is to name the blocker, so name it.
      # The job needs the checkout for that: the gate used to be inline shell,
      # which is why it had no working tree.
      - uses: actions/checkout@v7
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
          CI_GATE_ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: echo "$NEEDS" | sh scripts/ci-gate.sh
