name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new push lands.
# Saves CI minutes when a developer pushes repeatedly to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Static analysis: typecheck, lint (parallel) ──────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint

  # ── Dependency audit: fail on high/critical vulns ─────────────────────────
  # Reads pnpm-lock.yaml only — no install needed, so this job is ~10s.
  # Gate at "high" to keep signal; moderate/low noise tracked separately.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level high

  # ── Seed smoke: catches dev-script breakage fast ────────────────────────
  # Runs against a throwaway DB so the seed script can't pass by reusing
  # stale state. pnpm + tsx resolution has bitten us before — keep this
  # under 3 min so it stays cheap on the free tier.
  seed-smoke:
    name: DB Seed Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare throwaway DB
        env:
          DATABASE_URL: file:./seed-smoke.db
          BETTER_AUTH_URL: http://localhost:4321
        run: pnpm prisma migrate deploy
      - name: Generate Prisma client
        env:
          DATABASE_URL: file:./seed-smoke.db
        run: pnpm prisma generate
      - name: Run seed
        env:
          DATABASE_URL: file:./seed-smoke.db
          BETTER_AUTH_URL: http://localhost:4321
        run: pnpm db:seed

  # ── Unit + integration tests ────────────────────────────────────────────
  # Split by vitest project, then shard each. Plain --shard=N/4 split by file
  # count and clustered the slow jsdom/MUI component files into one shard
  # (66s vs 25s siblings). node project = many fast suites (2 shards);
  # jsdom = few heavy component suites (3 shards). Wall time = setup (~30s)
  # + slowest leg. Coverage only on push (sharded, merged in coverage-gate).
  test:
    name: Test (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: node, shard: 1, total: 4 }
          - { project: node, shard: 2, total: 4 }
          - { project: node, shard: 3, total: 4 }
          - { project: node, shard: 4, total: 4 }
          - { project: jsdom, shard: 1, total: 3 }
          - { project: jsdom, shard: 2, total: 3 }
          - { project: jsdom, shard: 3, total: 3 }

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No `cache: pnpm` here — node_modules cache below already covers
          # installs; downloading the pnpm store too costs 9-13s per leg.
          cache-dependency-path cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - name: Run tests (no coverage on PRs) — ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
        if: github.event_name == 'pull_request'
        run: pnpm vitest run --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=test-results.json
      - name: Run tests with coverage — ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
        if: github.event_name != 'pull_request'
        run: >-
          pnpm vitest run --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}
          --coverage --reporter=default --reporter=json --outputFile=test-results.json
          --coverage.reportsDirectory=coverage/leg-${{ matrix.project }}-${{ matrix.shard }}
        env:
          COVERAGE_THRESHOLDS: "1"
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results.json
            coverage/leg-${{ matrix.project }}-${{ matrix.shard }}/coverage-summary.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Report flaky tests (${{ matrix.project }} ${{ matrix.shard }})
        if: always()
        run: node scripts/report-flaky.mjs test-results.json || true

  # Coverage merge + threshold gate (only on push). Runs after shards.
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request'
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
      - name: Merge coverage and check thresholds
        run: |
          node -e "
          const fs=require('fs'), path=require('path');
          const dirs=fs.readdirSync('coverage').filter(d=>d.startsWith('leg-'));
          let merged=null;
          for(const d of dirs){
            const p=path.join('coverage',d,'coverage-summary.json');
            if(!fs.existsSync(p)){ console.warn('missing',p); continue; }
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!merged) merged=j;
            else {
              for(const k of ['lines','functions','branches','statements']){
                merged.total[k].pct = Math.min(merged.total[k].pct, j.total[k].pct);
              }
            }
          }
          if(!merged) throw new Error('no coverage legs found');
          console.log('Merged (min) coverage:', JSON.stringify(merged.total,null,2));
          const t={lines:94,functions:89,branches:82,statements:91};
          for(const k in t) if(merged.total[k].pct < t[k]) throw new Error(k+' coverage '+merged.total[k].pct+'% < '+t[k]+'%');
          "

  # ── Build (needed for E2E) ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
          retention-days: 1

  # ── Lighthouse — only on push to main, not on PRs ────────────────────────
  # Optimized for <60s: single run, single URL on fast path, reuses build artifact,
  # caches node_modules. Full 3×3 runs only when LHCI_FULL=1 (manual).
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/
      - name: Prepare database for Lighthouse
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: file:./ci-test.db
      - name: "Run Lighthouse CI (fast: 1 run x 1 URL)"
        run: pnpm lhci
        env:
          LHCI_FAST: "1"

  # ── E2E tests ──────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        uses: actions/cache@v6
        id: nm-cache
        with:
          path: |
            node_modules
            src/lib/__generated__
          key: nm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('prisma/schema.prisma') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm playwright --version)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-${{ runner.os }}-chromium
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install chromium
      - name: Install Playwright system deps
        run: pnpm playwright install-deps chromium
      - name: Run E2E tests
        run: pnpm playwright test
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  check-android:
    name: Check Android Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android-app/**'

  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: check-android
    if: needs.check-android.outputs.android == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create placeholder google-services.json
        working-directory: android-app
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.cabeda.Convocados" } }, "api_key": [{ "current_key": "placeholder" }] }],
            "configuration_version": "1"
          }
          EOF

      - name: Build phone debug APK
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --no-daemon

  android-wear:
    name: Wear OS Build
    runs-on: ubuntu-latest
    needs: check-android
    if: needs.check-android.outputs.android == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Wear OS debug APK
        working-directory: android-app
        run: ./gradlew :wear:assembleDebug --no-daemon



  # ── Gate job: single required status check for branch protection ─────────
  # Branch protection requires a check named "CI". This job depends on all
  # the real jobs and reports a single pass/fail status.
  ci-gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, lint, audit, test, build, e2e, seed-smoke]
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
