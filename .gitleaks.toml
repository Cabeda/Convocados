title = "Convocados gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "test and example secrets"
paths = [
  # NOTE: never path-allowlist a whole *config or source* file. playwright.config.ts
  # was once listed here, which silently exempted a hardcoded VAPID private key from
  # every scan. Test fixtures belong in e2e/ or src/test/, matched by regex below.
  '''e2e/.*''',
  '''src/test/.*''',
  '''\.env\.example$''',
  '''bruno/.*''',
  '''android-app/app/google-services\.json''',
  '''android-app/wear/google-services\.json''',
]
regexes = [
  '''e2e-test-secret''',
  '''mtBHItJI5svbpC7sc9axQiA''',
  '''test-trusted-.*''',
  '''test-secret''',
]
