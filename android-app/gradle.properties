android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
# Reuse the configuration phase across builds (Gradle 9 configuration cache).
org.gradle.configuration-cache=true
# AGP 9 built-in Kotlin is enabled again: KSP 2.3.11 and Hilt 2.60.1 both
# support it, so the android.builtInKotlin=false / android.newDsl=false
# opt-outs from the earlier workaround are gone.
