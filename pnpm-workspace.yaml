packages:
  - "."

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@eslint-react/ast@5.17.3'
  - '@eslint-react/core@5.17.3'
  - '@eslint-react/eslint-plugin@5.17.3'
  - '@eslint-react/eslint@5.17.3'
  - '@eslint-react/jsx@5.17.3'
  - '@eslint-react/shared@5.17.3'
  - '@eslint-react/var@5.17.3'
  - eslint-plugin-react-dom@5.17.3
  - eslint-plugin-react-jsx@5.17.3
  - eslint-plugin-react-naming-convention@5.17.3
  - eslint-plugin-react-rsc@5.17.3
  - eslint-plugin-react-web-api@5.17.3
  - eslint-plugin-react-x@5.17.3
  - '@playwright/test@1.62.0'
  - eslint@10.8.0
  - playwright-core@1.62.0
  - playwright@1.62.0
overrides:
  # Quadratic-time CPU DoS in basic-ftp's Client.list() parser (GHSA-c475-qrg2-pj4r),
  # reached through @lhci/cli -> lighthouse -> puppeteer-core -> proxy-agent.
  # Patched in 6.2.1. This single entry replaces the older version-scoped
  # basic-ftp pins, which shadowed it and left the vulnerable 6.0.1 resolved.
  basic-ftp: '>=6.2.1'
  better-auth@<1.6.2: '>=1.6.2'
  body-parser@<1.20.6: '>=1.20.6'
  # minimatch/glob ask for brace-expansion ^4 and ^2. An open-ended '>=5.0.7'
  # override let pnpm satisfy a ^2 request with 4.x, which is now the vulnerable
  # line (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p: DoS via uncontrolled
  # recursion). The upper bound is the fix: 5.0.11 is patched, 4.x is not.
  brace-expansion@>=3.0.0 <5.0.7: '>=5.0.7 <6.0.0'
  # 5.0.9 was still resolving through minimatch (Stryker). Two fresh advisories
  # cover it; the fix is the same shape — a patched version exists, so constrain
  # the range rather than ignore the advisory.
  brace-expansion@>=5.0.0 <5.0.11: '>=5.0.11 <6.0.0'
  browserslist@<=4.28.6: '>=4.28.7'
  deepmerge-ts@<8.0.0: '>=8.0.0'
  devalue@>=5.6.3 <=5.8.0: '>=5.8.1'
  effect@<3.20.0: '>=3.20.0'
  # max-stale can disclose cross-user cached responses (GHSA-ch52-4w7c-c8xp).
  # Reached through astro -> @astrojs/node, so it is in the server render path.
  # The advisory names >=4.2.1 as patched, but no 4.2.1 was ever published; 4.3.0
  # is the patched release and satisfies astro's own ^4.2.0 request.
  http-cache-semantics@<=4.2.0: '>=4.3.0'
  # ajv asks for fast-uri ^3.0.1. An open-ended '>=3.1.6' override let pnpm
  # resolve that to the 4.x line, which carries the authority-injection
  # advisory below — so the upper bound is part of the fix, not decoration.
  fast-uri@>=3.0.0 <3.1.6: '>=3.1.6 <4.0.0'
  # fast-uri 4.x: authority injection via an unvalidated port in serialize.
  # Reached only through dev tooling (ajv -> Stryker, and @prisma/streams-local
  # -> prisma CLI), but the audit gate covers dev dependencies too. Kept as the
  # guard for any future dependency that requests 4.x directly.
  fast-uri@>=4.0.0 <4.1.4: '>=4.1.4'
  ip-address@<=10.3.0: '>=10.3.1'
  js-yaml@>=3.0.0 <3.15.2: '>=3.15.2'
  kysely@>=0.26.0 <0.28.17: '>=0.28.17'
  mysql2@<3.22.0: '>=3.22.0'
  nanoid@<3.3.18: '>=3.3.18'
  path-to-regexp@<0.1.13: '>=0.1.13'
  # IP spoofing via IPv4-mapped IPv6 trust subnet (GHSA-jqcg-44mw-7w3h),
  # reached through @lhci/cli -> express. Patched in 2.0.8; all live
  # dependents request the v2 line, so stay on it.
  proxy-addr@<2.0.8: '>=2.0.8'
  qs@<6.16.0: '>=6.16.0'
  # sharp <0.35.5: CVE-2026-96889 via librsvg (GHSA-wq5f-xc86-pv6w).
  # Reached through astro -> @astrojs/node. Patched in 0.35.5.
  sharp: '>=0.35.5'
  # event-loop DoS through indexed source-map section offsets
  # (GHSA-68fv-2mgg-jv7q), reached through astro's toolchain (magicast,
  # svgo/css-tree). Patched in 1.2.2; all dependents request v1.
  source-map-js@<1.2.2: '>=1.2.2'
  tmp@<0.2.6: '>=0.2.6'
  tmp@<=0.2.3: '>=0.2.4'
  # DoS via memory leak on premature response close (GHSA-vc2v-76pw-4v95),
  # reached through @lhci/cli. Patched in 1.8.2; the dependent requests v1.
  compression@<1.8.2: '>=1.8.2'
  uuid@<11.1.1: '>=11.1.1'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
auditConfig:
  ignoreGhsas:
    # extract-zip <=2.0.1 (GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3): patched
    # 2.0.2 not yet on npm. Dev-only (@lhci -> puppeteer chain). Remove ignores
    # once 2.0.2 publishes, then add override `extract-zip@<=2.0.1: '>=2.0.2'`.
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
