packages:
  - "."

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@eslint-react/ast@5.17.3'
  - '@eslint-react/core@5.17.3'
  - '@eslint-react/eslint-plugin@5.17.3'
  - '@eslint-react/eslint@5.17.3'
  - '@eslint-react/jsx@5.17.3'
  - '@eslint-react/shared@5.17.3'
  - '@eslint-react/var@5.17.3'
  - eslint-plugin-react-dom@5.17.3
  - eslint-plugin-react-jsx@5.17.3
  - eslint-plugin-react-naming-convention@5.17.3
  - eslint-plugin-react-rsc@5.17.3
  - eslint-plugin-react-web-api@5.17.3
  - eslint-plugin-react-x@5.17.3
  - '@playwright/test@1.62.0'
  - eslint@10.8.0
  - playwright-core@1.62.0
  - playwright@1.62.0
overrides:
  basic-ftp@<=5.2.2: '>=5.3.0'
  basic-ftp@<=5.3.0: '>=5.3.1'
  better-auth@<1.6.2: '>=1.6.2'
  body-parser@<1.20.6: '>=1.20.6'
  brace-expansion@>=3.0.0 <5.0.7: '>=5.0.7'
  deepmerge-ts@<8.0.0: '>=8.0.0'
  devalue@>=5.6.3 <=5.8.0: '>=5.8.1'
  effect@<3.20.0: '>=3.20.0'
  fast-uri@>=3.0.0 <=3.1.3: '>=3.1.4'
  ip-address@<=10.3.0: '>=10.3.1'
  kysely@>=0.26.0 <0.28.17: '>=0.28.17'
  nanoid@<3.3.18: '>=3.3.18'
  path-to-regexp@<0.1.13: '>=0.1.13'
  qs@>=6.11.1 <=6.15.1: '>=6.15.2'
  tmp@<0.2.6: '>=0.2.6'
  tmp@<=0.2.3: '>=0.2.4'
  uuid@<11.1.1: '>=11.1.1'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
auditConfig:
  ignoreGhsas:
    # extract-zip <=2.0.1 (GHSA-jmr9-qjv8-65gv): patched 2.0.2 not yet on npm.
    # Dev-only (@lhci -> puppeteer chain). Remove ignore once 2.0.2 publishes,
    # then add override `extract-zip@<=2.0.1: '>=2.0.2'`.
    - GHSA-jmr9-qjv8-65gv
