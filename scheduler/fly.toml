app = "convocados-scheduler"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_URL = "https://convocados.cabeda.dev"
  CONCURRENCY = "3"
  POLL_INTERVAL_MS = "10000"

[restart]
  # A stopped poller must come back without a human: reminders, the recurring
  # advance, invite expiry and db-maintenance all stop with it.
  policy = "always"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
